program: wandb_dkt_train.py
method: grid
metric:
  goal: maximize
  name: validauc
parameters:
  model_name:
    values: ["dkt"]
  dataset_name:
    values: ["assist2015"] # 先确认真实数据集目录名
  emb_type:
    values: ["qid"]
  save_dir:
    values: ["models/dkt_tiaocan_test"] # 单独建个test目录，避免和正式sweep混在一起
  emb_size:
    values: [64]
  learning_rate:
    values: [1e-3, 1e-4]
  dropout:
    values: [0.1, 0.3]
  seed:
    values: [42]
  fold:
    values: [0]
