program: wandb_dkt_plus_train.py
method: bayes
metric:
  goal: maximize
  name: validauc
parameters:
  model_name:
    values: ["dkt+"]
  dataset_name:
    values: ["assist2015"]
  emb_type:
    values: ["qid"]
  save_dir:
    values: ["models/dkt_plus_tiaocan"]
  emb_size:
    values: [256]
  learning_rate:
    values: [5e-4]
  lambda_r:
    values: [0.10]
  lambda_w1:
    values: [0.10]
  lambda_w2:
    values: [30.0]
  dropout:
    values: [0.5]
  seed:
    values: [42]
  fold:
    values: [0]
